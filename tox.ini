[tox]
runner = uv-venv-lock-runner
env_list =
    py{315,314,313,312}-{test,lint}

[testenv:py{315,314,313,312}-test]
runner = uv-venv-lock-runner
commands =
    pytest tests

[testenv:py{315,314,313,312}-lint]
runner = uv-venv-lock-runner
# tox-uv drops UV_PYTHON from set_env, so pass it on the command.
set_env =
    UV_PROJECT_ENVIRONMENT = {env_dir}
allowlist_externals = env
commands =
    env UV_PYTHON={env_python} pre-commit run --all-files --hook-stage=manual
