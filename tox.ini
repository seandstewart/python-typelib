[tox]
runner = uv-venv-lock-runner
env_list =
    py{315,314,313,312}-{test,lint}

[testenv:py{315,314,313,312}-test]
runner = uv-venv-lock-runner
commands =
    pytest tests

[testenv:py{315,314,313,312}-lint]
runner = uv-venv-lock-runner
commands =
    pre-commit run --all-files --hook-stage=manual
