name: Create Tag

on:
  push:
    branches:
    - 'main'
    tags-ignore:
    - '**'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

defaults:
  run:
    shell: bash

jobs:
  create-version:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ ubuntu-latest ]
        python-version: [ "3.14" ]
    steps:
    - uses: actions/create-github-app-token@v1
      id: app-token
      with:
        app-id: ${{ vars.RELEASE_BOT_APP_ID }}
        private-key: ${{ secrets.RELEASE_BOT_APP_PKEY }}
    - uses: actions/checkout@v4
      with:
        token: ${{ steps.app-token.outputs.token }}
        fetch-depth: 0
        fetch-tags: true
    - name: Check for existing tag
      id: existing-tag
      run: |
        if git tag --points-at HEAD | grep -q '^v'; then
          echo "skip=true" >> "$GITHUB_OUTPUT"
        fi
    - uses: ./.github/actions/bootstrap-environ
      if: steps.existing-tag.outputs.skip != 'true'
      id: bootstrap-environ
      with:
        python-version: ${{ matrix.python-version }}
        runner: ${{ matrix.os }}
    # In order to make a commit, we need to initialize a user.
    - name: Initialize mandatory git config
      if: steps.existing-tag.outputs.skip != 'true'
      run: |
        git config user.name "GitHub actions"
        git config user.email noreply@github.com
    - name: Tag New Version
      if: steps.existing-tag.outputs.skip != 'true'
      run: make release-version ref=${{ github.ref_name }}
